<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Project Gantt Chart</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }
        h1 {
            text-align: center;
            padding: 20px;
            background: #333;
            color: white;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
            background: white;
            border-bottom: 1px solid #ddd;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }
        #chart {
            width: 100vw;
            height: calc(100vh - 100px);
            overflow: auto;
        }
        .bar {
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .bar:hover {
            opacity: 0.7;
        }
        .tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            z-index: 1000;
            max-width: 450px;
            display: none;
            line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .tooltip-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            border-bottom: 1px solid #555;
            padding-bottom: 8px;
        }
        .tooltip-section {
            margin-top: 10px;
        }
        .tooltip-section-title {
            color: #aaa;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .tooltip-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        .tooltip-label {
            color: #ccc;
        }
        .tooltip-value {
            font-weight: 500;
        }
        .tooltip-resources {
            background: rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 4px;
            margin-top: 4px;
        }
        .tooltip-resource {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }
        .controls {
            padding: 10px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .controls label {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>
    <h1>Construction Project Gantt Chart</h1>
    
    <div class="legend">
        <div class="legend-item">

            <span>Outline Level 0</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #2ca02c;"></div>
            <span>Outline Level 1</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ff7f0e;"></div>
            <span>Outline Level 2</span>
        </div>
    </div>
    
    <div class="controls">
        <label>
            <input type="checkbox" id="showLevel0" checked> Show Level 0
        </label>
        <label>
            <input type="checkbox" id="showLevel1" checked> Show Level 1
        </label>
        <label>
            <input type="checkbox" id="showLevel2" checked> Show Level 2
        </label>
        <label>

        </label>
        <label>
            Start: <input type="date" id="filterStart">
        </label>
        <label>
            End: <input type="date" id="filterEnd">
        </label>
    </div>
    
    <div id="chart"></div>
    <div class="tooltip" id="tooltip"></div>

            const filterEnd = document.getElementById('filterEnd').value;
            
            filteredTasks = tasks.filter(t => {
                if (t.level === 0 && !showLevel0) return false;
                if (t.level === 1 && !showLevel1) return false;
                if (t.level === 2 && !showLevel2) return false;
                if (filterStart && t.finish < filterStart) return false;
                if (filterEnd && t.start > filterEnd) return false;
                return true;
            });
            
            const showDates = document.getElementById('showDates').checked;
            const leftMargin = showDates ? margin.left : 150;
            
            const width = document.getElementById('chart').clientWidth;
            const height = Math.max(600, filteredTasks.length * rowHeight + margin.top + margin.bottom);
            
            d3.select('#chart').select('svg').remove();
            
            const svg = d3.select('#chart')
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
            const g = svg.append('g')
                .attr('transform', `translate(${leftMargin}, ${margin.top})`);
            
            const minDate = d3.min(filteredTasks, d => new Date(d.start));
            const maxDate = d3.max(filteredTasks, d => new Date(d.finish));
            
            const xScale = d3.scaleTime()
                .domain([minDate, d3.timeDay.offset(maxDate, 7)])
                .range([0, width - leftMargin - margin.right]);
            
            const yScale = d3.scaleBand()
                .domain(filteredTasks.map((d, i) => i))
                .range([0, filteredTasks.length * rowHeight])
                .padding(0.1);
            
            const xAxis = d3.axisTop(xScale)
                .ticks(d3.timeMonth.every(2))
                .tickFormat(d3.timeFormat('%b %Y'));
            
            g.append('g')
                .attr('class', 'x-axis')
                .call(xAxis)
                .selectAll('text')
                .style('font-size', '12px');
            
            g.selectAll('.grid-line')
                .data(xScale.ticks(d3.timeMonth.every(2)))
                .enter()
                .append('line')
                .attr('class', 'grid-line')
                .attr('x1', d => xScale(d))
                .attr('x2', d => xScale(d))
                .attr('y1', 0)
                .attr('y2', filteredTasks.length * rowHeight)
                .attr('stroke', '#e0e0e0')
                .attr('stroke-dasharray', '3,3');
            
            const tooltip = d3.select('#tooltip');
            
            g.selectAll('.bar')
                .data(filteredTasks)
                .enter()
                .append('rect')
                .attr('class', 'bar')
                .attr('x', d => xScale(new Date(d.start)))
                .attr('y', (d, i) => yScale(i) + (yScale.bandwidth() - barHeight) / 2)
                .attr('width', d => Math.max(4, xScale(new Date(d.finish)) - xScale(new Date(d.start))))
                .attr('height', barHeight)
                .attr('rx', 3)
                .attr('fill', d => levelColors[d.level])
                .attr('stroke', d => d.level === 0 ? '#000' : 'none')
                .attr('stroke-width', d => d.level === 0 ? 2 : 0)
                .on('mouseover', (event, d) => {
                    const startDate = new Date(d.start).toLocaleDateString();
                    const endDate = new Date(d.finish).toLocaleDateString();
                    const taskInfo = taskMap[d.name] || { predecessors: "", resources: [], duration: "" };
                    
                    let tooltipContent = `
                        <div class="tooltip-title">${d.name}</div>
                        <div class="tooltip-section">
                            <div class="tooltip-row">
                                <span class="tooltip-label">Start:</span>
                                <span class="tooltip-value">${startDate}</span>
                            </div>
                            <div class="tooltip-row">
                                <span class="tooltip-label">Finish:</span>
                                <span class="tooltip-value">${endDate}</span>
                            </div>
                            <div class="tooltip-row">
                                <span class="tooltip-label">Duration:</span>
                                <span class="tooltip-value">${taskInfo.duration}</span>
                            </div>
                            <div class="tooltip-row">
                                <span class="tooltip-label">Level:</span>
                                <span class="tooltip-value">${d.level}</span>
                            </div>
                        </div>
                    `;
                    
                    if (taskInfo.predecessors) {
                        tooltipContent += `
                            <div class="tooltip-section">
                                <div class="tooltip-section-title">Predecessors</div>
                                <div class="tooltip-value" style="font-size: 12px;">${taskInfo.predecessors}</div>
                            </div>
                        `;
                    }
                    
                    if (taskInfo.resources && taskInfo.resources.length > 0) {
                        tooltipContent += `<div class="tooltip-section"><div class="tooltip-section-title">Resources / Units</div>`;
                        taskInfo.resources.forEach(r => {
                            tooltipContent += `
                                <div class="tooltip-resources">
                                    <div class="tooltip-resource">
                                        <span>${r.name}</span>
                                        <span>${r.work} / ${r.units}</span>
                                    </div>
                                </div>
                            `;
                        });
                        tooltipContent += `</div>`;
                    }
                    
                    tooltip.style('display', 'block').html(tooltipContent);
                })
                .on('mousemove', (event) => {
                    const tooltipNode = tooltip.node();
                    const tooltipWidth = tooltipNode.offsetWidth || 450;
                    const tooltipHeight = tooltipNode.offsetHeight || 200;
                    const padding = 15;
                    
                    let left = event.pageX + padding;
                    let top = event.pageY - tooltipHeight / 2;
                    
                    if (left + tooltipWidth > window.innerWidth - padding) {
                        left = event.pageX - tooltipWidth - padding;
                    }
                    if (left < padding) {
                        left = padding;
                    }
                    if (top < padding) {
                        top = padding;
                    }
                    if (top + tooltipHeight > window.innerHeight - padding) {
                        top = window.innerHeight - tooltipHeight - padding;
                    }
                    
                    tooltip.style('left', left + 'px')
                        .style('top', top + 'px');
                })
                .on('mouseout', () => {
                    tooltip.style('display', 'none');
                });
            
            const nameLabels = svg.append('g')
                .attr('transform', `translate(0, ${margin.top})`);
            
            nameLabels.selectAll('.task-label')
                .data(filteredTasks)
                .enter()
                .append('text')
                .attr('class', 'task-label')
                .attr('x', 5)
                .attr('y', (d, i) => yScale(i) + yScale.bandwidth() / 2 + 4)
                .attr('font-size', '11px')
                .attr('fill', d => d.level === 0 ? '#000' : '#333')
                .attr('font-weight', d => d.level === 0 ? 'bold' : 'normal')
                .text(d => {
                    const name = d.name.length > 45 ? d.name.substring(0, 42) + '...' : d.name;
                    return name;
                });
            
            nameLabels.selectAll('.date-label')
                .data(filteredTasks)
                .enter()
                .append('text')
                .attr('class', 'date-label')
                .attr('x', showDates ? leftMargin - 10 : leftMargin - 5)
                .attr('y', (d, i) => yScale(i) + yScale.bandwidth() / 2 + 4)
                .attr('text-anchor', 'end')
                .attr('font-size', '10px')
                .attr('fill', '#666')
                .style('display', showDates ? 'block' : 'none')
                .text(d => {
                    const start = new Date(d.start).toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
                    const end = new Date(d.finish).toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
                    return `${start} - ${end}`;
                });
        }
        
        document.getElementById('showLevel0').addEventListener('change', updateChart);
        document.getElementById('showLevel1').addEventListener('change', updateChart);
        document.getElementById('showLevel2').addEventListener('change', updateChart);
        document.getElementById('showDates').addEventListener('change', updateChart);
        document.getElementById('filterStart').addEventListener('change', updateChart);
        document.getElementById('filterEnd').addEventListener('change', updateChart);
        
        window.addEventListener('resize', updateChart);
        
        updateChart();
    </script>
</body>
</html>
